version: "3"

dotenv:
  - ".env"

tasks:
  default:
    desc: "show all available tasks"
    cmds:
      - task --list-all
    silent: true

  lint:
    cmds:
      - golangci-lint run --timeout 5m --config .golangci.yml
    silent: true

  tidy:
    desc: install pkg listed in go.mod
    cmds:
      - go mod tidy

  codecov:
    desc: run unit test and force coverage > 80%
    cmds:
      - go test -coverprofile=coverage.out $(go list ./... | grep -vE "resilience|concurrency")
      - go tool cover -func=coverage.out | awk '/^total:/ { if ($3+0 < 80) { print "Coverage below 80%"; exit 1 } }'

  deps:
    desc: install dependencies
    cmds:
      - go install github.com/vektra/mockery/v3@v3.6.4
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest

  check-vuln:
    - govulncheck ./...

  governance:
    desc: check precommit
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - gosec ./...
      - golangci-lint run --timeout 5m --config .golangci.yml
